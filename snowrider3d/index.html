<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snow Rider 3D</title>
<link rel="stylesheet" href="themes.css" />
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #231F20; }
#gameContainer { width: 100vw; height: 100vh; }
#gameContainer canvas { width: 100% !important; height: 100% !important; display: block; }
</style>
<script src="UnityProgress.js"></script>
<script src="UnityLoader.js"></script>
</head>
<body>
<div id="gameContainer"></div>
<script>
var gameInstance = UnityLoader.instantiate("gameContainer", "SnowRider3D-gd-1.json", {
  onProgress: UnityProgress,
  Module: {
    onRuntimeInitialized: function () {
      UnityProgress(gameInstance, "complete");
      var canvas = document.querySelector("#gameContainer canvas");
      if (canvas) { canvas.style.width = "100%"; canvas.style.height = "100%"; }
    },
  },
});
</script>
</body>
</html>
